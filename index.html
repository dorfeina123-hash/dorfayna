<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="לקוחות">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מעקב לקוחות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* layout: single column, summary tiles first, then filter chips, then client cards in original list order */
:root{
  --paper:#f3f5f7; --card:#ffffff; --ink:#13202b; --muted:#5a6a78; --line:#dde3e8; --accent:#0e6b72;
  --ok:#1d7a4c; --ok-bg:#e3f4ea; --wait:#a8540a; --wait-bg:#fdeedd; --pay:#b3261e; --pay-bg:#fde7e5;
  --edit:#8a6400; --edit-bg:#fbf0c9; --flag:#6a3fbf; --flag-bg:#ece6fa; --none:#5a6a78; --none-bg:#e8ecef;
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f171d; --card:#18232b; --ink:#e8eef3; --muted:#93a4b2; --line:#2a3945; --accent:#5cc4cc;
    --ok:#6fd49b; --ok-bg:#16382a; --wait:#f0a869; --wait-bg:#3d2a16; --pay:#ff9189; --pay-bg:#442220;
    --edit:#e8c35c; --edit-bg:#3b3112; --flag:#b99cf5; --flag-bg:#2d2548; --none:#93a4b2; --none-bg:#232f39;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f171d; --card:#18232b; --ink:#e8eef3; --muted:#93a4b2; --line:#2a3945; --accent:#5cc4cc;
  --ok:#6fd49b; --ok-bg:#16382a; --wait:#f0a869; --wait-bg:#3d2a16; --pay:#ff9189; --pay-bg:#442220;
  --edit:#e8c35c; --edit-bg:#3b3112; --flag:#b99cf5; --flag-bg:#2d2548; --none:#93a4b2; --none-bg:#232f39;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{padding:16px 16px 48px;max-width:640px;margin:0 auto}
h1{font-size:22px;font-weight:800;margin:4px 0 14px;text-wrap:balance}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.hot b{color:var(--flag)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#08161a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#08161a}}
.chip.add{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .chip.add{color:#08161a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.add{color:#08161a}}
.tools{display:flex;gap:8px;margin-bottom:12px}
input[type=search],input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sort{flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:36px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:right;font:inherit;color:inherit;width:100%}
.row:focus-visible,.chip:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row.open{border-inline-start:5px solid var(--flag)}
.num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.name{font-weight:600;font-size:17px}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.b{font-size:12.5px;border-radius:999px;padding:3px 10px;font-weight:600}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-wait{background:var(--wait-bg);color:var(--wait)}
.s-pay{background:var(--pay-bg);color:var(--pay)}.s-edit{background:var(--edit-bg);color:var(--edit)}
.s-flag{background:var(--flag-bg);color:var(--flag)}.s-none{background:var(--none-bg);color:var(--none)}
.note{font-size:13.5px;margin-top:8px;color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
.sheet h2{margin:0;font-size:19px}
.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
.acts{display:flex;gap:10px}
.btn{flex:1;font:inherit;font-size:16px;font-weight:600;border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.p{color:#08161a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.p{color:#08161a}}
.msg{font-size:13px;color:var(--muted);margin-top:14px}
@media (prefers-reduced-motion: no-preference){.row{transition:border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var KEY='fayna-clients-v1';
  var STATE={rows:[]};
  try{ var raw=localStorage.getItem(KEY); if(raw){ var p=JSON.parse(raw); if(p&&Array.isArray(p.rows)) STATE=p; } }catch(e){}
  var ALBUM = ["נמסר","תמונות בלבד","ממתין לבחירת לקוח","בעריכה/תיקונים","ממתין לתשלום","דורש טיפול","אין"];
  var VIDEO = ["נמסר","בעריכה","אין"];
  var OPENALB = {"ממתין לבחירת לקוח":1,"בעריכה/תיקונים":1,"ממתין לתשלום":1,"דורש טיפול":1};
  var CLS = {"נמסר":"s-ok","תמונות בלבד":"s-ok","ממתין לבחירת לקוח":"s-wait","בעריכה/תיקונים":"s-edit","ממתין לתשלום":"s-pay","דורש טיפול":"s-flag","בעריכה":"s-edit","אין":"s-none"};
  var ui = {filter:'all', q:'', desc:false, notice:''};
  var app = document.getElementById('app');

  function isOpen(r){ return !!OPENALB[r.album] || r.video==='בעריכה' || (r.bal||0)>0; }
  function fmtDate(s){ var p=s.split('-'); return (+p[2])+'.'+(+p[1])+'.'+p[0]; }
  function fmtMoney(n){ return n.toLocaleString('he-IL')+' ₪'; }
  function h(tag, attrs, kids){
    var e=document.createElement(tag);
    if(attrs) for(var k in attrs){ if(k==='text') e.textContent=attrs[k]; else if(k==='class') e.className=attrs[k]; else e.setAttribute(k,attrs[k]); }
    (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }
  function badge(label, prefix){ return h('span',{class:'b '+(CLS[label]||'s-none'),text:(prefix?prefix+' ':'')+label}); }

  function render(){
    var rows = STATE.rows.slice();
    var openCount = rows.filter(isOpen).length;
    var owed = rows.reduce(function(a,r){return a+(r.bal||0);},0);
    var withBal = rows.filter(function(r){return (r.bal||0)>0;}).length;
    var list = rows.filter(function(r){
      if(ui.filter==='open' && !isOpen(r)) return false;
      if(ui.filter==='bal' && !((r.bal||0)>0)) return false;
      if(ui.q && (r.name+' '+(r.note||'')).indexOf(ui.q)<0) return false;
      return true;
    });
    list.sort(function(a,b){ return ui.desc ? b.n-a.n : a.n-b.n; });

    app.innerHTML='';
    app.appendChild(h('h1',{text:'מעקב לקוחות – דור פיינה צילום'}));
    app.appendChild(h('div',{class:'tiles'},[
      h('div',{class:'tile hot'},[h('b',{text:String(openCount)}),h('span',{text:'דורשים טיפול'})]),
      h('div',{class:'tile'},[h('b',{text:fmtMoney(owed)}),h('span',{text:'יתרה לגבייה ('+withBal+' לקוחות)'})])
    ]));
    var bar=h('div',{class:'bar'});
    [['all','הכל ('+rows.length+')'],['open','דורש טיפול ('+openCount+')'],['bal','יתרה לתשלום ('+withBal+')']].forEach(function(f){
      var c=h('button',{class:'chip',type:'button','aria-pressed':String(ui.filter===f[0]),text:f[1]});
      c.onclick=function(){ui.filter=f[0];render();};
      bar.appendChild(c);
    });
    var add=h('button',{class:'chip add',type:'button',text:'+ לקוח חדש'});
    add.onclick=function(){openSheet(null);};
    bar.appendChild(add);
    app.appendChild(bar);
    var tools=h('div',{class:'tools'});
    var q=h('input',{type:'search',id:'q',placeholder:'חיפוש לפי שם או הערה','aria-label':'חיפוש'});
    q.value=ui.q;
    q.oninput=function(){ var pos=q.selectionStart; ui.q=q.value; render(); var n=document.getElementById('q'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} };
    var s=h('button',{class:'chip sort',type:'button',text:ui.desc?'מהחדש לישן':'לפי סדר הרשימה'});
    s.onclick=function(){ui.desc=!ui.desc;render();};
    tools.appendChild(q); tools.appendChild(s);
    app.appendChild(tools);

    var box=h('div',{class:'list'});
    if(!rows.length) box.appendChild(h('div',{class:'empty',text:'אין עדיין נתונים במכשיר הזה. לחץ על "ייבוא מגיבוי" ובחר את קובץ הלקוחות, או הוסף לקוח חדש.'}));
    else if(!list.length) box.appendChild(h('div',{class:'empty',text:'אין לקוחות שמתאימים לסינון'}));
    list.forEach(function(r){
      var b=h('button',{class:'row'+(isOpen(r)?' open':''),type:'button'},[
        h('div',{class:'num',text:String(r.n)}),
        h('div',null,[
          h('div',{class:'name',text:r.name}),
          h('div',{class:'meta',text:fmtDate(r.date)+(r.type&&r.type!=='חתונה'?' · '+r.type:'')}),
          h('div',{class:'badges'},[
            badge(r.album, r.album==='נמסר'||r.album==='אין'||r.album==='תמונות בלבד'?'אלבום':'אלבום:'),
            badge(r.video,'וידאו'),
            (r.bal>0)?h('span',{class:'b s-pay',text:'יתרה '+fmtMoney(r.bal)}):null
          ]),
          r.note?h('div',{class:'note',text:r.note}):null
        ])
      ]);
      b.onclick=function(){ openSheet(r.n); };
      box.appendChild(b);
    });
    app.appendChild(box);
    var foot=h('div',{class:'bar',style:'margin-top:18px'});
    var bk=h('button',{class:'chip',type:'button',text:'גיבוי'}); bk.onclick=doBackup;
    var cp=h('button',{class:'chip',type:'button',text:'העתקת גיבוי'}); cp.onclick=doCopy;
    var im=h('button',{class:'chip',type:'button',text:'ייבוא מגיבוי'}); im.onclick=openImport;
    foot.appendChild(bk); foot.appendChild(cp); foot.appendChild(im);
    app.appendChild(foot);
    if(ui.notice) app.appendChild(h('div',{class:'msg',text:ui.notice}));
  }

  function field(label, ctrl){ return h('label',{class:'f'},[h('span',{text:label}),ctrl]); }
  function select(opts, val){ var s=h('select'); opts.forEach(function(o){var op=h('option',{value:o,text:o}); if(o===val) op.selected=true; s.appendChild(op);}); return s; }

  var TYPES = ["חתונה","בר מצווה","עליה לתורה","אחר"];
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  function openSheet(n){
    var isNew = (n===null);
    var r;
    if(isNew){
      var mx=STATE.rows.reduce(function(a,x){return Math.max(a,x.n);},0);
      r={n:mx+1,name:'',date:todayISO(),album:'אין',video:'אין',bal:null,note:null,type:'חתונה'};
    } else {
      r=STATE.rows.filter(function(x){return x.n===n;})[0];
      if(!r) return;
    }
    var nm=h('input',{type:'text',id:'f-name',autocomplete:'off'}); nm.value=r.name;
    var dt=h('input',{type:'date',id:'f-date'}); dt.value=r.date;
    var ty=select(TYPES,r.type||'חתונה');
    var alb=select(ALBUM,r.album), vid=select(VIDEO,r.video);
    var bal=h('input',{type:'number',inputmode:'numeric',min:'0'}); bal.value=r.bal||'';
    var note=h('textarea',{rows:'3'}); note.value=r.note||'';
    var err=h('div',{class:'msg',role:'alert'});
    var scrim=h('div',{class:'scrim',role:'dialog','aria-modal':'true','aria-label':isNew?'לקוח חדש':r.name});
    var close=function(){ if(scrim.parentNode) scrim.parentNode.removeChild(scrim); };
    var save=h('button',{class:'btn p',type:'button',text:isNew?'הוספה':'שמירה'});
    var cancel=h('button',{class:'btn',type:'button',text:'ביטול'});
    cancel.onclick=close;
    scrim.onclick=function(e){ if(e.target===scrim) close(); };
    save.onclick=function(){
      var name=nm.value.trim();
      if(!name){ err.textContent='יש להזין שם לקוחות.'; return; }
      if(!dt.value){ err.textContent='יש לבחור תאריך אירוע.'; return; }
      r.name=name; r.date=dt.value; r.type=ty.value;
      r.album=alb.value; r.video=vid.value;
      var v=parseInt(bal.value,10); r.bal=(isFinite(v)&&v>0)?v:null;
      r.note=note.value.trim()||null;
      if(isNew) STATE.rows.push(r);
      close(); persist();
    };
    scrim.appendChild(h('div',{class:'sheet'},[
      h('h2',{text:isNew?'לקוח חדש':'עריכת לקוח'}),
      field('שם לקוחות',nm), field('תאריך אירוע',dt), field('סוג אירוע',ty),
      field('אלבום / תמונות',alb), field('וידאו',vid),
      field('יתרה לתשלום (₪)',bal), field('הערה',note),
      err,
      h('div',{class:'acts'},[save,cancel])
    ]));
    app.appendChild(scrim);
  }

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(STATE)); return true; }catch(e){ return false; } }
  function persist(){
    ui.notice = save() ? 'נשמר במכשיר.' : 'לא ניתן לשמור בדפדפן הזה (אולי גלישה פרטית). עשה גיבוי כדי לא לאבד שינויים.';
    render();
  }
  function stamp(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function backupText(){ return JSON.stringify({version:1,exported:stamp(),rows:STATE.rows},null,1); }
  function doBackup(){
    var text=backupText(), name='clients-backup-'+stamp()+'.json';
    try{
      var f=new File([text],name,{type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:'גיבוי מעקב לקוחות'}).catch(function(){});
        return;
      }
    }catch(e){}
    try{
      var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      ui.notice='הקובץ ירד למכשיר. שמור אותו ב-iCloud או שלח אותו למייל.'; render();
    }catch(e){ ui.notice='הגיבוי נכשל. נסה "העתקת גיבוי".'; render(); }
  }
  function doCopy(){
    try{
      navigator.clipboard.writeText(backupText()).then(function(){ ui.notice='הגיבוי הועתק. הדבק אותו בפתק או במייל.'; render(); },
        function(){ ui.notice='ההעתקה נחסמה בדפדפן. השתמש בכפתור "גיבוי".'; render(); });
    }catch(e){ ui.notice='ההעתקה לא נתמכת כאן. השתמש בכפתור "גיבוי".'; render(); }
  }
  function applyImport(text){
    var p; try{ p=JSON.parse(text); }catch(e){ return 'הקובץ אינו תקין.'; }
    var rows=Array.isArray(p)?p:(p&&p.rows);
    if(!Array.isArray(rows)||!rows.length) return 'לא נמצאו לקוחות בקובץ.';
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(!r||typeof r.n!=='number'||!r.name||!/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')) return 'שורה '+(i+1)+' בקובץ אינה תקינה.';
    }
    STATE={rows:rows}; persist(); return '';
  }
  function openImport(){
    var file=h('input',{type:'file',id:'imp-file',accept:'.json,application/json,text/plain'});
    var ta=h('textarea',{rows:'4',id:'imp-text',placeholder:'או הדבק כאן את תוכן הגיבוי'});
    var err=h('div',{class:'msg',role:'alert'});
    var scrim=h('div',{class:'scrim',role:'dialog','aria-modal':'true','aria-label':'ייבוא מגיבוי'});
    var close=function(){ if(scrim.parentNode) scrim.parentNode.removeChild(scrim); };
    var go=h('button',{class:'btn p',type:'button',text:'ייבוא'});
    var cancel=h('button',{class:'btn',type:'button',text:'ביטול'});
    cancel.onclick=close; scrim.onclick=function(e){ if(e.target===scrim) close(); };
    function finish(text){ var m=applyImport(text); if(m){ err.textContent=m; } else { close(); } }
    go.onclick=function(){
      var f=file.files&&file.files[0];
      if(f){ var rd=new FileReader(); rd.onload=function(){ finish(String(rd.result)); }; rd.onerror=function(){ err.textContent='קריאת הקובץ נכשלה.'; }; rd.readAsText(f); }
      else if(ta.value.trim()){ finish(ta.value); }
      else { err.textContent='בחר קובץ או הדבק את תוכן הגיבוי.'; }
    };
    var kids=[h('h2',{text:'ייבוא מגיבוי'})];
    if(STATE.rows.length) kids.push(h('div',{class:'msg',text:'הייבוא מחליף את כל הלקוחות השמורים במכשיר הזה.'}));
    kids.push(field('קובץ גיבוי',file), field('הדבקה',ta), err, h('div',{class:'acts'},[go,cancel]));
    scrim.appendChild(h('div',{class:'sheet'},kids));
    app.appendChild(scrim);
  }

  render();
})();
</script>
</body>
</html>
